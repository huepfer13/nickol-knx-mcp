# Room Template — Living room (Гостиная)
schema_version: 1
slot_id: living
labels:
  ru: Гостиная
  en: Living room

parameters:
  lighting_circuits:
    default: 3
    provenance: {source: preset_rule, note: "chandelier + spots + accent — 3 circuits"}
  windows:
    default: 3
    provenance: {source: preset_rule}
  venetian_windows:
    default: 0
    provenance: {source: preset_rule, note: "opt-in: set >0 where blinds have slats (façade/venetian)"}
  area_m2:
    default: 28
    role: hint
    provenance: {source: preset_default, user_overridden: false,
                 note: ">18 m² typically justifies multiple circuits — recommender only"}

slots:
  - slot_id: main_light
    labels: {ru: свет, en: light}
    presets:
      basic:   {enabled: true, function: lighting_switch, multiplicity: {param: lighting_circuits}}
      comfort: {enabled: true, function: lighting_dimmer, multiplicity: {param: lighting_circuits}}

  - slot_id: accent_light
    labels: {ru: акцентный свет, en: accent light}
    presets:
      basic:   {enabled: false}
      comfort: {enabled: true, function: lighting_switch, multiplicity: {fixed: 2}}

  - slot_id: window
    labels: {ru: окно, en: window}
    presets:
      basic:   {enabled: true, function: shutter, multiplicity: {param: windows}}
      comfort: {enabled: true, function: shutter, multiplicity: {param: windows}}

  # Venetian / façade blinds (slat control + wind/frost safety-lock). Opt-in:
  # emits nothing until venetian_windows > 0, so a plain roller-shutter house is
  # unchanged. Where windows carry slats, set venetian_windows and drop the roller
  # count in `windows` accordingly.
  - slot_id: venetian_blind
    labels: {ru: венецианские жалюзи, en: venetian blind}
    presets:
      basic:   {enabled: true, function: shutter_venetian, multiplicity: {param: venetian_windows}}
      comfort: {enabled: true, function: shutter_venetian, multiplicity: {param: venetian_windows}}

  - slot_id: presence
    labels: {ru: датчик, en: sensor}
    presets:
      basic:   {enabled: false}
      comfort: {enabled: true, function: presence, multiplicity: {fixed: 1}}

  - slot_id: floor_heating
    labels: {ru: тёплый пол, en: floor heating}
    presets:
      basic:   {enabled: false}
      comfort: {enabled: true, function: climate_floor, multiplicity: {fixed: 1}}

automation_intents:
  - intent: scene_lighting
    description: "Recall living-room lighting scenes (movie/evening/bright)."
    criticality: convenience
    implementation: external
  # Safety-related: wind/frost retracts the blinds. This protection MUST live in
  # KNX (autonomous, network-independent), never in Home Assistant — the actuator
  # listens on the shutter_venetian safety-lock input.
  - intent: wind_frost_blind_protection
    description: "Retract/lock blinds on high wind or frost (via the safety-lock input)."
    criticality: safety_related
    implementation: knx
